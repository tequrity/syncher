# Builds the plugin and publishes a GitHub release when a version tag (e.g. 0.2.0) is pushed.
# The tag must equal the version in manifest.json (Obsidian and BRAT look for exactly that).
name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check that the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match manifest.json version $version" >&2
            exit 1
          fi

      - name: Build
        run: |
          npm ci
          npm run release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME}" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md)
          gh release create "${GITHUB_REF_NAME}" \
            --title "Obsyncher ${GITHUB_REF_NAME}" \
            --notes "$notes" \
            main.js manifest.json styles.css
